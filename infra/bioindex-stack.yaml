AWSTemplateFormatVersion: '2010-09-09'
Description: bioindex consolidated deployment — ECS Fargate + ALB + autoscale (one per env)

Parameters:
  Env:
    Type: String
    AllowedValues: [qa, prod]
    Description: Environment name (qa or prod).
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC in which the service runs.
  PrivateSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets for the ECS tasks and ALB (>= 2, different AZs).
  AlbIngressSgId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group allowed to reach the ALB on port 80 (e.g. a bastion or test host SG). The stack creates a single SG-to-SG ingress rule for this. To allow additional sources during side-by-side validation, add them manually to the ALB SG after stack creation.
  RdsSgIds:
    Type: CommaDelimitedList
    Description: Security groups of the RDS instances. Note - the stack does NOT manage ingress rules on these SGs; the operator must add 3306-from-tasks-SG manually post-creation. See runbook.
  TaskCpu:
    Type: String
    Default: '1024'
    Description: Fargate task CPU (1024 = 1 vCPU).
  TaskMemory:
    Type: String
    Default: '4096'
    Description: Fargate task memory in MiB.
  MinTasks:
    Type: Number
    Default: 1
  MaxTasks:
    Type: Number
    Default: 8
  AutoscaleTarget:
    Type: Number
    Default: 50
    Description: ALBRequestCountPerTarget target value.
  LogRetentionDays:
    Type: Number
    Default: 30
  TokenSigningKeySecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret containing BIOINDEX_TOKEN_SIGNING_KEY.

Outputs:
  AlbDnsName:
    Description: Internal ALB DNS name. Reachable from within the VPC by hosts whose SG is allowed through AlbIngressSgId.
    Value: !GetAtt LoadBalancer.DNSName
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn

Resources:
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub 'bioindex-tasks-${Env}-sg'
      GroupDescription: !Sub 'Fargate task security group for bioindex-${Env}'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS egress (S3, ECR, Secrets Manager, CloudWatch)
        - IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: 169.254.169.253/32
          Description: VPC DNS resolver (TCP)
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 169.254.169.253/32
          Description: VPC DNS resolver (UDP)

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub 'bioindex-alb-${Env}-sg'
      GroupDescription: !Sub 'ALB security group for bioindex-${Env}'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref AlbIngressSgId

  # NOTE: egress from TaskSecurityGroup to RDS instances on 3306 is NOT
  # managed by this stack. After infra-create.sh completes, the operator
  # must add an inbound rule to each portal's RDS SG (listed via the
  # RdsSgIds parameter) allowing 3306 from TaskSecurityGroup. The runbook
  # at docs/plan-b-runbook.md documents this step.

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'bioindex-task-exec-${Env}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadTokenSigningKey
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref TokenSigningKeySecretArn

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'bioindex-task-${Env}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BioindexTaskPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - 'arn:aws:s3:::dig-*'
                  - 'arn:aws:s3:::dig-*/*'
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:GetItem
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/rsidmapping_*'
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: '*'

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub 'bioindex-${Env}'
      ClusterSettings:
        - Name: containerInsights
          Value: disabled

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/bioindex/${Env}'
      RetentionInDays: !Ref LogRetentionDays

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub 'bioindex-${Env}-alb'
      Scheme: internal
      Type: application
      Subnets: !Ref PrivateSubnets
      SecurityGroups:
        - !Ref AlbSecurityGroup

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub 'bioindex-${Env}-tg'
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 5000
      TargetType: ip
      HealthCheckProtocol: HTTP
      HealthCheckPath: /ready
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
        - Key: stickiness.enabled
          Value: 'false'

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub 'bioindex-${Env}'
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: bioindex
          Image: !Sub
            - '${AcctId}.dkr.ecr.${Region}.amazonaws.com/bioindex-base:latest'
            - AcctId: !Ref AWS::AccountId
              Region: !Ref AWS::Region
          Essential: true
          PortMappings:
            - ContainerPort: 5000
              Protocol: tcp
          Environment:
            - Name: BIOINDEX_ENV
              Value: !Ref Env
            - Name: BIOINDEX_WORKERS
              Value: '2'
          Secrets:
            - Name: BIOINDEX_TOKEN_SIGNING_KEY
              ValueFrom: !Ref TokenSigningKeySecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: task
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -fsS http://localhost:5000/health || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 90
          StopTimeout: 30

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: !Sub 'bioindex-${Env}'
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !Ref MinTasks
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref PrivateSubnets
          SecurityGroups: [!Ref TaskSecurityGroup]
          AssignPublicIp: ENABLED
      LoadBalancers:
        - TargetGroupArn: !Ref TargetGroup
          ContainerName: bioindex
          ContainerPort: 5000
      HealthCheckGracePeriodSeconds: 90
      EnableExecuteCommand: true
      TaskDefinition: !Ref TaskDefinition

  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ResourceId: !Sub 'service/${Cluster}/${Service.Name}'
      ScalableDimension: ecs:service:DesiredCount
      MinCapacity: !Ref MinTasks
      MaxCapacity: !Ref MaxTasks
      RoleARN: !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService'

  ScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub 'bioindex-${Env}-target-tracking-rcp'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Sub
            - 'app/${LbName}/${LbId}/targetgroup/${TgName}/${TgId}'
            - LbName: !Select [2, !Split ['/', !Ref LoadBalancer]]
              LbId: !Select [3, !Split ['/', !Ref LoadBalancer]]
              TgName: !GetAtt TargetGroup.TargetGroupName
              TgId: !Select [2, !Split ['/', !GetAtt TargetGroup.TargetGroupFullName]]
        TargetValue: !Ref AutoscaleTarget
        ScaleInCooldown: 300
        ScaleOutCooldown: 60
