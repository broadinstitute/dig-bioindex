AWSTemplateFormatVersion: 2010-09-09
Description:
  --Alternative to lambda indexing
Resources:
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: batch-indexer-repo
  BatchServiceRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - batch.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSBatchServiceRole'
  IndexerBatchComputeEnv:
    Type: 'AWS::Batch::ComputeEnvironment'
    Properties:
      Type: MANAGED
      ServiceRole: !GetAtt BatchServiceRole.Arn
      ComputeResources:
        Type: Fargate
        MaxvCpus: 128
        Subnets:
          - subnet-041ed74e61806c6f0
        SecurityGroupIds:
          - sg-28485f53
  IndexerBatchJobQueue:
    Type: 'AWS::Batch::JobQueue'
    Properties:
      JobQueueName: 'indexer-job-queue'
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref IndexerBatchComputeEnv
      Priority: 1
      State: ENABLED
  BatchIndexerJobDefinition:
    Type: 'AWS::Batch::JobDefinition'
    Properties:
      Type: 'container'
      JobDefinitionName: 'batch-indexer-job'
      PlatformCapabilities:
        - 'FARGATE'
      Timeout:
        # 4h headroom: fanout indexes a single large file per job (falcon variant_files
        # are ~6.6 GB). Was 3600 (1h); a big file can brush that ceiling.
        AttemptDurationSeconds: 14400
      RetryStrategy:
        # Retry ONLY infra failures that happened before the container ran — e.g. the
        # CannotPullContainerError ECR-pull timeouts that silently dropped 4 files on
        # 2026-07-01 when many tasks pulled the image at once. A job that produced an exit
        # code actually ran and may have partially inserted records; re-running it would
        # DUPLICATE rows (the indexer workers are not idempotent — insert only appends),
        # so it EXITs and is surfaced by the orchestrator's per-child status check instead.
        Attempts: 5
        EvaluateOnExit:
          - Action: EXIT       # container ran (has an exit code) -> do not retry (dup risk)
            OnExitCode: '*'
          - Action: RETRY      # never ran (pull/init failure, no exit code) -> retry
            OnStatusReason: '*'
      ContainerProperties:
        Image: !Sub '${AWS::AccountId}.dkr.ecr.us-east-1.amazonaws.com/batch-indexer-repo'
        Command:
          - 'python3'
          - 'index_files.py'
          - '-f'
          - 'Ref::file'
          - '-i'
          - 'Ref::index'
          - '-a'
          - 'Ref::arity'
          - '-b'
          - 'Ref::bucket'
          - '-r'
          - 'Ref::rds-secret'
          - '-s'
          - 'Ref::rds-schema'
          - '-z'
          - 'Ref::file-size'
        JobRoleArn: !GetAtt IndexerRole.Arn
        ExecutionRoleArn: !GetAtt IndexerRole.Arn
        ResourceRequirements:
          - Type: 'VCPU'
            Value: '2.0'
          - Type: 'MEMORY'
            Value: '16384'
        NetworkConfiguration:
          AssignPublicIp: 'ENABLED'
        FargatePlatformConfiguration:
          PlatformVersion: 'LATEST'

  BatchGroupIndexerJobDefinition:
    Type: 'AWS::Batch::JobDefinition'
    Properties:
      Type: 'container'
      JobDefinitionName: 'batch-group-indexer-job'
      # A grouped worker indexes MANY keys per job, so a rerun that re-inserts is far more
      # costly than in fanout. The EvaluateOnExit rules below are what make retrying safe:
      # anything that produced an exit code EXITs (the container ran and may have inserted),
      # and only pre-run infra failures RETRY. Do not relax them to a bare Attempts count —
      # Batch would rerun this worker directly, bypassing the parent build()'s
      # delete_stale_keys() cleanup, and double-insert. If you ever need that, add a
      # delete_key-before-reindex guard in index_group.py first.
      Parameters:
        s3-subdir: ''
      PlatformCapabilities:
        - 'FARGATE'
      Timeout:
        AttemptDurationSeconds: 14400
      RetryStrategy:
        Attempts: 5
        EvaluateOnExit:
          - Action: EXIT       # container ran (has an exit code) -> do not retry (dup risk)
            OnExitCode: '*'
          - Action: RETRY      # never ran (pull/init failure, no exit code) -> retry
            OnStatusReason: '*'
      ContainerProperties:
        Image: !Sub '${AWS::AccountId}.dkr.ecr.us-east-1.amazonaws.com/batch-indexer-repo'
        Command:
          - 'python3'
          - 'index_group.py'
          - '-i'
          - 'Ref::index'
          - '-a'
          - 'Ref::arity'
          - '-b'
          - 'Ref::bucket'
          - '-r'
          - 'Ref::rds-secret'
          - '-s'
          - 'Ref::rds-schema'
          - '--s3-subdir'
          - 'Ref::s3-subdir'
          - '-p'
          - 'Ref::prefix'
          - '--prefer-compressed'
          - 'Ref::prefer-compressed'
          - '--chunk-index'
          - 'Ref::chunk-index'
          - '--chunk-count'
          - 'Ref::chunk-count'
          - '--group-size'
          - 'Ref::group-size'
          - '--group-max-bytes'
          - 'Ref::group-max-bytes'
          - '--expected-total'
          - 'Ref::expected-total'
        JobRoleArn: !GetAtt IndexerRole.Arn
        ExecutionRoleArn: !GetAtt IndexerRole.Arn
        ResourceRequirements:
          - Type: 'VCPU'
            Value: '2.0'
          - Type: 'MEMORY'
            Value: '8192'
        NetworkConfiguration:
          AssignPublicIp: 'ENABLED'
        FargatePlatformConfiguration:
          PlatformVersion: 'LATEST'

  IndexerRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - 'ecs-tasks.amazonaws.com'
            Action:
              - 'sts:AssumeRole'
      Path: '/'
      Policies:
        - PolicyName: 'S3Access'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 's3:ListBucket'
                Resource:
                  - '*'
              - Effect: 'Allow'
                Action:
                  - 's3:GetObject'
                Resource:
                  - 'arn:aws:s3:::*/*'
        - PolicyName: 'ECSTaskExecution'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'ecr:GetAuthorizationToken'
                  - 'ecr:BatchCheckLayerAvailability'
                  - 'ecr:GetDownloadUrlForLayer'
                  - 'ecr:BatchGetImage'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: '*'
        - PolicyName: 'SecretsManagerAccess'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'secretsmanager:GetSecretValue'
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:*'




