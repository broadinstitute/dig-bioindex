AWSTemplateFormatVersion: 2010-09-09
Description:
  --Alternative to lambda indexing
Resources:
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: batch-indexer-repo
  BatchServiceRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - batch.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSBatchServiceRole'
  IndexerBatchComputeEnv:
    Type: 'AWS::Batch::ComputeEnvironment'
    Properties:
      Type: MANAGED
      ServiceRole: !GetAtt BatchServiceRole.Arn
      ComputeResources:
        Type: Fargate
        MaxvCpus: 128
        Subnets:
          - subnet-041ed74e61806c6f0
        SecurityGroupIds:
          - sg-28485f53
  IndexerBatchJobQueue:
    Type: 'AWS::Batch::JobQueue'
    Properties:
      JobQueueName: 'indexer-job-queue'
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref IndexerBatchComputeEnv
      Priority: 1
      State: ENABLED
  BatchIndexerJobDefinition:
    Type: 'AWS::Batch::JobDefinition'
    Properties:
      Type: 'container'
      JobDefinitionName: 'batch-indexer-job'
      PlatformCapabilities:
        - 'FARGATE'
      Timeout:
        # 4h headroom: fanout indexes a single large file per job (falcon variant_files
        # are ~6.6 GB). Was 3600 (1h); a big file can brush that ceiling.
        AttemptDurationSeconds: 14400
      ContainerProperties:
        Image: !Sub '${AWS::AccountId}.dkr.ecr.us-east-1.amazonaws.com/batch-indexer-repo'
        Command:
          - 'python3'
          - 'index_files.py'
          - '-f'
          - 'Ref::file'
          - '-i'
          - 'Ref::index'
          - '-a'
          - 'Ref::arity'
          - '-b'
          - 'Ref::bucket'
          - '-r'
          - 'Ref::rds-secret'
          - '-s'
          - 'Ref::rds-schema'
          - '-z'
          - 'Ref::file-size'
        JobRoleArn: !GetAtt IndexerRole.Arn
        ExecutionRoleArn: !GetAtt IndexerRole.Arn
        ResourceRequirements:
          - Type: 'VCPU'
            Value: '2.0'
          - Type: 'MEMORY'
            Value: '16384'
        NetworkConfiguration:
          AssignPublicIp: 'ENABLED'
        FargatePlatformConfiguration:
          PlatformVersion: 'LATEST'

  BatchGroupIndexerJobDefinition:
    Type: 'AWS::Batch::JobDefinition'
    Properties:
      Type: 'container'
      JobDefinitionName: 'batch-group-indexer-job'
      # Intentionally NO RetryStrategy (attempts defaults to 1). Re-runs must go through
      # the parent build(), whose delete_stale_keys() cleans any partially-indexed keys
      # before re-indexing. A Batch auto-retry would re-run this worker directly, bypassing
      # that cleanup and double-inserting records. Do not add retries without first adding a
      # delete_key-before-reindex guard in index_group.py.
      Parameters:
        s3-subdir: ''
      PlatformCapabilities:
        - 'FARGATE'
      Timeout:
        AttemptDurationSeconds: 14400
      ContainerProperties:
        Image: !Sub '${AWS::AccountId}.dkr.ecr.us-east-1.amazonaws.com/batch-indexer-repo'
        Command:
          - 'python3'
          - 'index_group.py'
          - '-i'
          - 'Ref::index'
          - '-a'
          - 'Ref::arity'
          - '-b'
          - 'Ref::bucket'
          - '-r'
          - 'Ref::rds-secret'
          - '-s'
          - 'Ref::rds-schema'
          - '--s3-subdir'
          - 'Ref::s3-subdir'
          - '-p'
          - 'Ref::prefix'
          - '--prefer-compressed'
          - 'Ref::prefer-compressed'
          - '--chunk-index'
          - 'Ref::chunk-index'
          - '--chunk-count'
          - 'Ref::chunk-count'
          - '--group-size'
          - 'Ref::group-size'
          - '--group-max-bytes'
          - 'Ref::group-max-bytes'
          - '--expected-total'
          - 'Ref::expected-total'
        JobRoleArn: !GetAtt IndexerRole.Arn
        ExecutionRoleArn: !GetAtt IndexerRole.Arn
        ResourceRequirements:
          - Type: 'VCPU'
            Value: '2.0'
          - Type: 'MEMORY'
            Value: '8192'
        NetworkConfiguration:
          AssignPublicIp: 'ENABLED'
        FargatePlatformConfiguration:
          PlatformVersion: 'LATEST'

  IndexerRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - 'ecs-tasks.amazonaws.com'
            Action:
              - 'sts:AssumeRole'
      Path: '/'
      Policies:
        - PolicyName: 'S3Access'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 's3:ListBucket'
                Resource:
                  - '*'
              - Effect: 'Allow'
                Action:
                  - 's3:GetObject'
                Resource:
                  - 'arn:aws:s3:::*/*'
        - PolicyName: 'ECSTaskExecution'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'ecr:GetAuthorizationToken'
                  - 'ecr:BatchCheckLayerAvailability'
                  - 'ecr:GetDownloadUrlForLayer'
                  - 'ecr:BatchGetImage'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: '*'
        - PolicyName: 'SecretsManagerAccess'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'secretsmanager:GetSecretValue'
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:*'




